<script>
(function () {
  'use strict';
  var data = document.getElementById('data').textContent.trim().split('.');
  var msg = document.getElementById('msg'), form = document.getElementById('f'), input = document.getElementById('k');
  function bytes(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), a = new Uint8Array(bin.length), i;
    for (i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function clean(v) {
    v = String(v || '').trim();
    var i = v.lastIndexOf('#');
    if (i >= 0) v = v.slice(i + 1);
    return v.replace(/[^A-Za-z0-9_-]/g, '');
  }
  function ask(text) { msg.textContent = text; form.hidden = false; }
  var done = false;
  /* Swap the lock screen for the decrypted page; scripts are re-created so that they run. */
  function show(html) {
    if (done) return;
    done = true;
    var doc = new DOMParser().parseFromString(html, 'text/html');
    document.documentElement.lang = doc.documentElement.lang || 'sk';
    document.head.innerHTML = doc.head.innerHTML;
    document.body.innerHTML = doc.body.innerHTML;
    Array.prototype.forEach.call(document.body.querySelectorAll('script'), function (old) {
      var s = document.createElement('script');
      s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    });
  }
  function whenParsed(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn); else fn();
  }
  function unlock(k) {
    if (!window.crypto || !window.crypto.subtle) { msg.textContent = 'Tento prehliadač stránku nevie otvoriť. Skús ju otvoriť v novšom prehliadači.'; return; }
    var raw;
    try { raw = bytes(k); } catch (e) { ask('Kľúč nie je správny. Skontroluj, či máš celý odkaz.'); return; }
    window.crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function (key) {
      return window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(data[0]) }, key, bytes(data[1]));
    }).then(function (buf) {
      try { localStorage.setItem('rodokmen-kluc', k); } catch (e) {}
      if (location.hash.slice(1) !== k) { try { history.replaceState(null, '', '#' + k); } catch (e) {} }
      var html = new TextDecoder('utf-8').decode(buf);
      whenParsed(function () { show(html); });
    }, function () { if (!done) ask('Kľúč nie je správny. Skontroluj, či máš celý odkaz.'); });
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var k = clean(input.value);
    if (k) { msg.textContent = 'Otváram…'; unlock(k); }
  });
  window.addEventListener('hashchange', function () {
    var h = clean(location.hash);
    if (!done && h) { msg.textContent = 'Otváram…'; unlock(h); }
  });
  var k = clean(location.hash), saved = '';
  try { saved = localStorage.getItem('rodokmen-kluc') || ''; } catch (e) {}
  if (k) unlock(k); else if (saved) unlock(saved); else ask('Táto stránka je zamknutá. Vlož sem celý odkaz, ktorý si dostal, alebo samotný kľúč.');
})();
</script>
